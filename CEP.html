<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENCONTRA CEP</title>
    <link rel="stylesheet" href="CEP.css">
</head>
<body>
    
    <fieldset>
        <div id="main">
            <h1>BUSCADOR DE ENDEREÇO</h1>
            <div id="divisaorastreador">
                <input id="CEP" type="text"/>
                <button onclick="carregaEndereco()" id="botaoprocurador">Procurar</button>
            </div>
            <div id="divisaoendereco">
                <label for="rua" class="divisaoendereco2">Rua:</label>
                <input id="rua" class="divisaoendereco2"type="text"/>
                <label for="bairro"class="divisaoendereco3">Bairro:</label>
                <input id="bairro" class="divisaoendereco3"type="text"/>
                <label for="cidade"class="divisaoendereco4">Cidade:</label>
                <input id="cidade" class="divisaoendereco4"type="text"/>
                <label for="estado"class="divisaoendereco5">Estado:</label>
                <input id="estado" class="divisaoendereco5"type="text"/>
            </div>
        </div>
    </fieldset>
</body>
<script src="CEP.js"></script>
</html>
